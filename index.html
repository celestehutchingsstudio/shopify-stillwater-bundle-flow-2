<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stillwater Bundle Setup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Flow 2 · Mark sets up the Build Your Bundle page in the Shopify theme editor.
   Two token sets: the editor chrome uses the Shopify admin foundations from the Figma file,
   and the storefront preview uses the Stillwater style sheet (same as Flow 1). */
:root{
  /* Stillwater storefront */
  --paper:#f6f2ec; --sand:#ede5da; --line:#cfc3b3; --ink:#141414; --muted:#6e655c;
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* Shopify admin */
  --a-canvas:#f1f1f1; --a-surface:#fff; --a-subtle:#f1f1f1; --a-hover:#ebebeb; --a-border:#e3e3e3; --a-strong:#8a8a8a;
  --a-text:#303030; --a-text2:#616161; --a-dis:#b5b5b5; --a-link:#005bd3; --a-sel:#005bd3; --a-crit:#8e0b21;
  --a-green-bg:#cdfed4; --a-green:#014b40; --a-info-bg:#e0f0ff; --a-info:#00527c; --a-btn:#303030;
  --a-shadow:0 4px 8px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.16);
  /* prototype shell */
  --shell:#e4ddd2;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--shell);color:var(--a-text);font-family:var(--ui);font-size:13px;line-height:20px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--shell)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--a-sel);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype controls (same bar as Flow 1) ---------- */
.ctl{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--shell);color:var(--ink);border-bottom:1px solid var(--line);z-index:80;font-size:14px}
.ctl-name{font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.ctl-name span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{padding:6px 12px;font-size:12px;font-weight:500;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ctl select{background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:6px 8px;font-size:12px;min-height:32px;max-width:100%}
.ctl .ghost{font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0 4px}
.ctl .spacer{flex:1}
@media (max-width:560px){.ctl-name span{display:none}.ctl .spacer{display:none}}

/* ---------- device ---------- */
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:stretch;overflow:hidden}
.phone-box{flex:1;min-width:0;display:flex}
.device{position:relative;flex:1;min-width:0;background:var(--a-canvas);overflow:hidden;display:flex;flex-direction:column}
.screen{position:relative;flex:1;min-height:0;display:flex;transform:translateZ(0);overflow:hidden}
#app{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.statusbar,.island,.homebar{display:none}
/* iPhone 15 frame: 393 × 852 screen, scaled to fit with --s. */
body.phone .stage{padding:16px;align-items:center}
body.phone .phone-box{flex:none;width:calc(419px * var(--s,1));height:calc(878px * var(--s,1))}
body.phone .device{flex:none;width:419px;height:878px;transform:scale(var(--s,1));transform-origin:0 0;border:13px solid #161616;border-radius:68px;box-shadow:0 0 0 2px #4a4845,0 0 0 3px #1d1d1d,0 32px 80px rgba(20,20,20,.32);background:#fff}
body.phone .statusbar{display:flex;flex:none;height:54px;align-items:center;justify-content:space-between;padding:6px 30px 0 52px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;font-weight:600;font-size:17px;letter-spacing:-.02em;color:#000;position:relative;z-index:5}
body.phone .statusbar .icons{display:flex;gap:6px;align-items:center}
body.phone .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:100}
body.phone .homebar{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000;z-index:100;pointer-events:none}

/* ---------- admin primitives ---------- */
.i20{width:20px;height:20px;flex:none;display:block}
.i16{width:16px;height:16px;flex:none;display:block}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--a-text);flex:none}
.ib:hover{background:var(--a-subtle)}
.ib[aria-pressed="true"],.ib.on{background:var(--a-subtle)}
.ib[disabled]{color:var(--a-dis);cursor:default;background:none}
.vdiv{width:1px;height:20px;background:var(--a-border);margin:0 6px;flex:none}
.abtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;line-height:20px;background:var(--a-surface);color:var(--a-text);box-shadow:inset 0 0 0 1px var(--a-border),0 1px 0 rgba(0,0,0,.08);white-space:nowrap}
.abtn:hover{background:#f7f7f7}
.abtn.primary{background:var(--a-btn);color:#fff;box-shadow:inset 0 -1px 0 #000,0 1px 0 rgba(0,0,0,.2)}
.abtn.primary:hover{background:#1a1a1a}
.abtn.primary[disabled]{background:var(--a-subtle);color:var(--a-dis);box-shadow:none;cursor:default}
.abtn.plain{box-shadow:none;background:none;font-weight:500}
.abtn.plain:hover{background:var(--a-subtle)}
.abtn.big{min-height:36px;padding:8px 16px}
.alink{color:var(--a-link);font-weight:500;font-size:13px}
.alink:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--a-green-bg);color:var(--a-green)}
.badge.info{background:var(--a-info-bg);color:var(--a-info)}

/* ---------- desktop editor ---------- */
.ed{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--a-canvas);position:relative}
.topbar{flex:none;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px 0 0;background:var(--a-surface);border-bottom:1px solid var(--a-border);gap:12px}
.topbar .l,.topbar .r{display:flex;align-items:center;gap:4px}
.topbar .l{height:100%;gap:2px}
.topbar .exit{display:flex;align-items:center;justify-content:center;width:56px;height:100%;border-right:1px solid var(--a-border);margin-right:10px}
.topbar .r{justify-content:flex-end;gap:6px}
.topbar .ib{width:36px;height:36px}
.topbar .ib.sel{color:var(--a-sel)}
.topbar .ib.on{background:var(--a-subtle)}
.topbar .mid{display:flex;align-items:center;gap:32px;position:relative}
.theme{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:450;white-space:nowrap}
.theme .badge{font-size:13px;line-height:18px;padding:3px 10px;font-weight:500}
.badge.nodot::before{display:none}
.pagesel{display:inline-flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:450;white-space:nowrap}
.pagesel:hover,.pagesel[aria-expanded="true"]{background:var(--a-subtle)}
.undogrp{display:inline-flex;border-radius:10px;background:#fafafa;box-shadow:inset 0 0 0 1px #ececec}
.undogrp .ib{width:34px}
.topbar .ib.boxed{box-shadow:inset 0 0 0 1px var(--a-border),0 1px 0 rgba(0,0,0,.06);background:#fff;border-radius:10px}
.topbar .abtn.big{border-radius:10px;min-height:36px;padding:8px 16px;font-size:14px}
@media (max-width:1180px){.topbar .hide-md{display:none}}
.body{flex:1;min-height:0;display:flex;gap:4px;padding:4px}
.side{flex:none;width:300px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.card{background:var(--a-surface);border-radius:12px;flex:none}
.side .grow{flex:1 0 auto}
.tree{padding:0 8px 8px}
.tree.foot-card{padding:8px}
.tree .ttl{padding:12px 8px;font-size:15px;line-height:24px;font-weight:600}
.tree hr{border:0;height:4px;background:var(--a-border);margin:8px 0;border-radius:2px}
.tree .grp{padding:8px 8px 4px;font-size:14px;font-weight:600}
.row{position:relative;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:8px;width:100%;text-align:left;color:var(--a-text)}
.row.tall{min-height:36px}
.row:hover{background:var(--a-subtle)}
.row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .lbl i{color:var(--a-text2)}
.row.dim{color:var(--a-dis)}
.row.dim .lbl i{color:var(--a-dis)}
.row.add{color:var(--a-link)}
.row.add.on{background:var(--a-subtle);font-weight:600}
.row .chev{color:var(--a-text)}
.row .eye{color:var(--a-dis)}
.row .sp{width:16px;flex:none}
.row.sec-on{background:var(--a-subtle);font-weight:600}
.row.cat{font-style:italic;color:var(--a-text2)}
.row.cat .thumb{width:16px;height:16px;border-radius:3px;object-fit:cover;flex:none;background:#2b2b2b}
.row.cat.on{background:var(--a-sel);color:#fff}
.row .grip{opacity:0;color:inherit;cursor:grab;display:inline-flex}
.row.cat:hover .grip,.row.cat.on .grip,.row.cat:focus-within .grip{opacity:1}
.row.cat.dragging{opacity:.4}
.row.cat.drop-before{box-shadow:inset 0 2px 0 var(--a-sel)}
.row.cat.drop-after{box-shadow:inset 0 -2px 0 var(--a-sel)}
.ind1{padding-left:16px}.ind2{padding-left:32px}.ind3{padding-left:48px}
.row-wrap{display:flex}
.row-wrap.ind2{padding-left:40px}
.row-wrap .row{flex:1}

.live{padding:16px}
.live .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.live .ok{width:20px;height:20px;border-radius:50%;background:#0c5132;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.live .url{color:var(--a-text2);margin:8px 0 12px;word-break:break-all}
.live .acts{display:flex;gap:8px;flex-wrap:wrap}

/* settings panel */
.set{display:flex;flex-direction:column}
.set-h{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;min-height:48px;border-bottom:1px solid var(--a-border);position:relative}
.set-h .t{flex:1;font-size:15px;font-weight:600;line-height:24px;display:flex;gap:8px;align-items:center;min-width:0}
.set-h .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-b{padding:16px;display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lab{font-size:13px;line-height:20px;color:var(--a-text)}
.inp{width:100%;min-height:32px;padding:5px 11px;border:1px solid var(--a-strong);border-radius:8px;background:#fff;font-size:13px;line-height:20px}
.inp:focus{outline:2px solid var(--a-sel);outline-offset:-1px;border-color:var(--a-sel)}
textarea.inp{min-height:80px;resize:vertical}
.selw{position:relative}
.selw select{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}
.selw svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.set-b hr{border:0;height:4px;background:var(--a-border);margin:0;border-radius:2px}
.set-b .sub{font-weight:600;font-size:13px}
.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--a-btn);flex:none}
.danger{display:inline-flex;align-items:center;gap:6px;align-self:center;color:var(--a-crit);font-weight:500;min-height:32px;padding:0 8px;border-radius:8px}
.danger:hover{background:#fee9e8}
.file{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--a-strong);border-radius:8px}
.file img,.file .noimg{width:56px;height:56px;border-radius:6px;object-fit:cover;flex:none;background:var(--a-subtle)}
.file .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.file .meta .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .meta .a{display:flex;gap:12px}
.empty{border:1px dashed var(--a-strong);border-radius:8px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--a-text2);text-align:center}
.coll{display:flex;gap:12px;align-items:center;padding:8px 8px 8px 8px;border:1px solid var(--a-strong);border-radius:8px}
.coll img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.coll .meta{flex:1;min-width:0}
.coll .meta b{display:block;font-weight:600}
.coll .meta span{color:var(--a-text2)}
.menu{position:absolute;right:8px;top:44px;z-index:20;background:#fff;border-radius:12px;box-shadow:var(--a-shadow);padding:6px;min-width:180px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:8px;min-height:32px}
.menu button:hover{background:var(--a-subtle)}
.menu button[disabled]{color:var(--a-dis);cursor:default;background:none}
.menu button.crit{color:var(--a-crit)}

/* preview */
.pv{flex:1;min-width:0;background:var(--a-surface);border-radius:12px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pv.phonepv{background:var(--a-canvas)}
.pv-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative}
.pv-wrap{position:relative}
.pv.phonepv .pv-wrap{width:390px;margin:28px auto 32px;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 0 0 1px var(--a-border)}

/* popovers and modal */
.pop{position:absolute;z-index:40;background:#fff;border-radius:12px;box-shadow:var(--a-shadow);padding:8px;width:300px;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.pop .search{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;border:1px solid var(--a-strong);border-radius:8px}
.pop .search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px}
.pop .search.focus,.pop .search:focus-within{border-color:var(--a-sel);box-shadow:0 0 0 1px var(--a-sel)}
.pop .grp{padding:8px 8px 4px;font-size:12px;font-weight:600;color:var(--a-text2)}
.pop .opt{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 8px;border-radius:8px;text-align:left}
.pop .opt:hover{background:var(--a-subtle)}
.pop .opt.on{background:var(--a-subtle);font-weight:600}
.pop .opt .lbl{flex:1}
.pop .opt.add{color:var(--a-link)}
.pop .tabs{display:flex;gap:4px;padding:8px 0 4px}
.pop .tabs button{padding:6px 10px;border-radius:8px;font-weight:600;color:var(--a-text2)}
.pop .tabs button[aria-pressed="true"]{background:var(--a-subtle);color:var(--a-text)}
.sec-opt{display:flex;gap:12px;align-items:center;width:100%;padding:8px;border-radius:8px;text-align:left}
.sec-opt:hover,.sec-opt.hl{background:var(--a-subtle)}
.sec-opt img{width:60px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.sec-opt b{display:block;font-weight:600}
.sec-opt span{color:var(--a-text2);font-size:12px;line-height:16px;display:block}
.pop .none{padding:12px 8px;color:var(--a-text2)}
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.modal{width:620px;max-width:100%;max-height:100%;background:#fff;border-radius:16px;box-shadow:var(--a-shadow);display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 12px 16px;border-bottom:1px solid var(--a-border);font-weight:600;font-size:14px}
.modal-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--a-border)}
.copt{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid var(--a-border)}
.copt:last-child{border-bottom:0}
.copt:hover{background:#f7f7f7}
.copt.on{background:var(--a-subtle);border-color:transparent}
.copt input{width:16px;height:16px;margin:0;accent-color:var(--a-btn);flex:none}
.copt img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none}
.copt .meta{flex:1;min-width:0}
.copt .meta b{display:block;font-weight:600}
.copt .meta span{color:var(--a-text2)}
.toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,12px);opacity:0;z-index:60;background:#1a1a1a;color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:8px;align-items:center;font-weight:500;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--a-shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Stillwater storefront (preview) ----------
   Ported from the Flow 1 coded prototype (stillwater-build-your-bundle) so both flows show the same storefront.
   The storefront is its own container, so it lays itself out at its own width:
   1440 on the desktop preview (zoomed to fit), 390 in the phone preview and the phone editor. */
.sf{container:app/inline-size;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.43;width:1440px;position:relative;--k:1}
.sf.m{width:100%}
.sf button{color:inherit;font:inherit;cursor:pointer;border:0;background:none;padding:0}
.sf .ic{width:16px;height:16px;flex:none;display:block}
.sf .d40{font-family:var(--display);font-weight:500;font-size:40px;line-height:44px;margin:0;text-wrap:balance}
.sf .d18{font-family:var(--display);font-weight:500;font-size:18px;line-height:24px;margin:0}
.sf .muted{color:var(--muted)}
.sf .t12{font-size:12px;line-height:20px}
.sf .t14{font-size:14px;line-height:20px}
.sf .num{font-variant-numeric:tabular-nums}
.sf .price{font-size:20px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums}
.sf .link{font-size:12px;line-height:16px;text-decoration:underline;text-underline-offset:3px;min-height:24px;display:inline-flex;align-items:center}
.sf .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background .15s,color .15s;text-align:center}
.sf .btn:hover{background:var(--sand)}
.sf .btn.solid{background:var(--ink);color:#fff}
.sf .btn.solid:hover{background:#2c2a27}
.sf .btn.block{width:100%}
.sf .btn .ic{width:14px;height:14px}
.sf .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.04em;background:var(--sand);color:var(--ink);white-space:nowrap}

/* header */
.sf .announce{background:var(--ink);color:#fff;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.04em;text-align:center;padding:10px 16px}
.sf .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px;padding:0 48px;border-bottom:1px solid var(--line)}
.sf .bar nav{display:flex;gap:28px}
.sf .bar nav span,.sf .bar .util .wide{font-size:12px;line-height:16px;white-space:nowrap}
.sf .logo{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:.12em;line-height:36px}
.sf .bar .util{display:flex;gap:28px;justify-content:flex-end;align-items:center}
.sf .bar .hb{display:none}

const ic = (n, c="i20") => `<svg class="${c}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- state ---------- */
let S;
function blank(){
  return {
    pageOpen:false, addOpen:false, addQ:"bundle", addTab:"sections",
    section:null, cats:[], sel:null, tier:1, bag:[],
    picker:null, pickerChoice:null, preview:"desktop",
    dirty:false, live:false, menu:false, msheet:null, nid:1
  };
}
function newSection(){
  return {heading:"Build your bundle", sub:"Customize a bundle of 3 products for a free Stillwater Pouch, or 4 for 10% off.", size1:3, reward1:"Free Stillwater Pouch", size2:4, reward2:"10% off the bundle"};
}
function newCat(withColl){
  const p = CAT_PRESETS[S.cats.length] || {name:"New category", sub:"", img:null, coll:null};
  return {id:"c"+(S.nid++), name:p.name, sub:p.sub, img:p.img, coll:withColl ? p.coll : null, preset:p.coll};
}

/* undo / redo over the page content */
let hist=[], fut=[], typingTimer=null;
const snap = () => JSON.stringify({section:S.section, cats:S.cats, sel:S.sel, nid:S.nid});
function record(){ hist.push(snap()); if(hist.length>80) hist.shift(); fut=[]; }
function recordTyping(){ if(!typingTimer) record(); clearTimeout(typingTimer); typingTimer=setTimeout(()=>typingTimer=null, 700); }
function restore(s){ const o=JSON.parse(s); Object.assign(S,o); S.dirty=true; S.live=false; render(); }
function undo(){ if(!hist.length) return; fut.push(snap()); restore(hist.pop()); }
function redo(){ if(!fut.length) return; hist.push(snap()); restore(fut.pop()); }
function changed(){ S.dirty=true; S.live=false; }

/* ---------- screen presets for "Jump to screen" ---------- */
function preset(n){
  S = blank(); hist=[]; fut=[]; freshView=true;
  if (n===1) S.pageOpen = true;
  if (n===2) S.addOpen = true;
  if (n>=3){ S.section = newSection(); S.sel = "section"; S.dirty = true; }
  if (n===4 || n===5){ const c=newCat(false); S.cats.push(c); S.sel=c.id; }
  if (n===5){ S.picker = S.cats[0].id; S.pickerChoice = "fragrance"; }
  if (n>=6){ for(let i=0;i<3;i++) S.cats.push(newCat(true)); S.sel = S.cats[1].id; }
  if (n===7){ S.preview="mobile"; S.sel=null; }
  if (n===8){ S.sel="section"; }
  if (n===9){ S.sel=null; S.dirty=false; S.live=true; }
  // the phone editor opens the matching sheet
  S.msheet = ({1:"templates",2:"add",3:"settings",4:"settings",5:"picker",6:"tree",8:"tree",9:"live"})[n] || null;
  render();
  if (n===6) scrollPreviewTo(S.cats[1].id);
  if (n===8) { const sc=previewScroller(); if(sc) sc.scrollTop=0; }
  if (n===9) toast("Saved");
}

/* ---------- layout mode ---------- */
let mobileUI=false, freshView=false, lastSheet=null;
function isMobileUI(){ return $("#screen").clientWidth < 860; }

/* ---------- storefront preview ---------- */
function tierLabel(size, reward){
  const r = String(reward||"").trim();
  const pct = r.match(/(\d+)\s*%/);
  if (pct) return `${size} for ${pct[1]}% off`;
  if (/^free\s+/i.test(r)) return `${size} for a free ${r.split(/\s+/).pop().toLowerCase()}`;
  return r ? `${size} for ${r}` : `${size} products`;
}
/* Flow 1 storefront icons (16 × 16, square caps) */
const SI = {
  plus:'<path d="M8 2v12M2 8h12"/>', close:'<path d="M3 3l10 10M13 3L3 13"/>', check:'<path d="M2.5 8.5l3.5 3.5 7.5-8"/>',
  menu:'<path d="M2 4h12M2 8h12M2 12h12"/>', search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
  bag:'<path d="M3 5h10l-1 9H4zM6 5V4a2 2 0 014 0v1"/>'
};
const ssvg = (n, cls="ic") => `<svg class="${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square" aria-hidden="true">${SI[n]}</svg>`;
function sfHeader(){
  return `<div class="announce"><span class="wide-only">New: the Tide Line collection &nbsp;&nbsp;·&nbsp;&nbsp; </span>Free shipping on orders $150+</div>
  <div class="bar">
    <nav><span>Shop</span><span>Build your bundle</span><span>Bestsellers</span><span>Journal</span></nav>
    <span class="hb">${ssvg("menu")}</span>
    <span class="logo">STILLWATER</span>
    <div class="util"><span class="wide">Search</span><span class="wide">Account</span><span class="icon-only">${ssvg("search")}</span><span class="icon-only bag" aria-label="Cart, 0 items">${ssvg("bag")}</span></div>
  </div>`;
}
function selDecor(kind, id, label){
  if (S.sel !== id) return `<span class="sel-hover"></span>`;
  return `<span class="sel-on"><span class="sel-tag">${label}</span></span>` + (kind==="cat" ? `<span class="askbar" aria-hidden="true"><span>${ic("sparkle")}Ask for changes</span><i></i><span>${ic("edit")}</span><span>${ic("more")}</span></span>` : "");
}
/* reward copy follows Flow 1, with the merchant's sizes and rewards filled in */
function rewardText(){
  const s=S.section, c=S.bag.length, n=[s.size1,s.size2][S.tier];
  const r1=String(s.reward1||"").trim(), r2=String(s.reward2||"").trim();
  const your = /^free\s+/i.test(r1) ? "your " + r1.replace(/^Free/,"free") : r1;
  if (c < s.size1) return {t:`${s.size1-c} more to unlock ${your}`, ok:false};
  if (S.tier===0) return {t:`${r1} unlocked. Switch to ${tierLabel(s.size2,r2)} your bundle.`, ok:true};
  if (c < n) return {t:`${r1} unlocked. ${n-c} more for ${r2}.`, ok:true};
  return {t:`Both rewards unlocked: ${r1.toLowerCase().replace(/^free stillwater/,"a free")} and ${r2}`, ok:true};
}
function bundleTotal(){
  const s=S.section, sum=S.bag.reduce((a,id)=>a+P[id].price,0);
  const pct = String(s.reward2).match(/(\d+)\s*%/);
  return S.tier===1 && pct && S.bag.length>=s.size2 ? sum - Math.round(sum*pct[1])/100 : sum;
}
function builder(){
  const s=S.section, n=[s.size1,s.size2][S.tier], c=S.bag.length, m=rewardText(), full=c>=s.size1;
  const slots = Array.from({length:n},(_,i)=>{
    const id=S.bag[i];
    if (!id) return `<div class="slot"><button type="button" class="ph" data-act="sf-pick" aria-label="Select product for slot ${i+1}">${ssvg("plus")}</button><span class="lbl"><span class="lg">Select product</span><span class="sh">Select</span></span></div>`;
    const p=P[id];
    return `<div class="slot filled"><div class="ph"><img src="${IMG(id)}" alt="${esc(p.name)}"><button type="button" class="rm" data-act="sf-rm" data-id="${id}" aria-label="Remove ${esc(p.name)}">${ssvg("close")}</button></div><span class="lbl">${esc(p.short)}</span></div>`;
  }).join("");
  const more = n-c;
  return `<section class="builder pick" data-pick="section" aria-label="Build your bundle">
    ${selDecor("section","section","Build Your Bundle")}
    <div class="intro"><h1 class="d40">${esc(s.heading)}</h1><p>${esc(s.sub)}</p></div>
    <div class="sizebtns" role="group" aria-label="Bundle size">
      <button type="button" class="btn" data-act="sf-tier" data-i="0" aria-pressed="${S.tier===0}">${esc(tierLabel(s.size1,s.reward1))}</button>
      <button type="button" class="btn" data-act="sf-tier" data-i="1" aria-pressed="${S.tier===1}">${esc(tierLabel(s.size2,s.reward2))}</button>
    </div>
    <div class="slots" style="--n:${n}">${slots}</div>
    <div class="summary"><span class="msg ${m.ok?"ok":""}">${esc(m.t)}</span><span class="price">Total: ${money(bundleTotal())}</span></div>
    ${full?`<button type="button" class="btn solid block" data-act="sf-noop">Add bundle to cart</button>${more>0?`<button type="button" class="link" data-act="sf-pick">Add ${more===1?"one":more} more for ${esc(String(s.reward2).replace(/ the bundle$/,""))}</button>`:""}`
          :`<button type="button" class="btn block" data-act="sf-pick">Select more products</button>`}
  </section>`;
}
function tile(id){
  const p=P[id], added=S.bag.includes(id);
  return `<article class="tile">
    <span class="imgbtn"><img src="${IMG(id)}" alt="" loading="lazy">${p.tag?`<span class="tag">${p.tag}</span>`:""}</span>
    <span class="namebtn"><span class="d18">${esc(p.tile||p.name)}</span><span class="t14 num">${money0(p.price)}</span><span class="t12 muted">${esc(p.desc)}</span></span>

  </article>`;
}
function catBlock(c){
  const co = c.coll && coll(c.coll);
  return `<section class="section" id="pv-${c.id}">
    <div class="banner pick ${c.img?"":"noimg"}" data-pick="${c.id}" ${c.img?`style="background-image:url('${IMG(c.img)}')"`:""}>
      ${selDecor("cat",c.id,"Category")}
      <h2 class="d40">${esc(c.name)||"&nbsp;"}</h2>${c.sub?`<p>${esc(c.sub)}</p>`:""}
    </div>
    ${co?`<div class="grid">${co.items.map(tile).join("")}</div>`:`<div class="hold">Select a collection to show its products</div>`}
  </section>`;
}
function storefront(m){
  let main;
  if (!S.section) main = `<div class="main"></div>`;
  else {
    const cats = S.cats.length ? S.cats.map(catBlock).join("") : `<div class="hold">Add a Category block to show products here</div>`;
    main = `<div class="main"><div class="bpage"><div class="products">${cats}</div><aside class="bside">${builder()}</aside></div></div>`;
  }
  const ins = (S.addOpen || (mobileUI && S.msheet==="add")) && !S.section ? `<div class="ins" aria-hidden="true"><span>${ic("plus","i16")}</span></div>` : "";
  return `<div class="sf ${m?"m":""}" id="sf">${sfHeader()}${ins}${main}<div class="foot"></div></div>`;
}

/* ---------- template tree ---------- */
function treeRows(withFooter=true){
  const r = [];
  const top = (icn, label) => `<div class="row">${ic("chevR","i16")}${ic(icn,"i16")}<span class="lbl">${label}</span></div>`;
  r.push(top("mail","Announcement bar"), top("store","Header"), `<hr>`, `<div class="grp">Template</div>`);
  r.push(`<div class="row dim"><span class="sp"></span>${ic("page","i16")}<span class="lbl">Page</span>${ic("eye","i16")}</div>`);
  r.push(`<div class="row dim">${ic("chevD","i16")}${ic("edit","i16")}<span class="lbl">Rich text</span>${ic("eye","i16")}</div>`);
  r.push(`<div class="row-wrap ind2"><div class="row add tall">${ic("plus","i16")}<span class="lbl">Add block</span></div></div>`);
  r.push(`<div class="row-wrap ind2"><div class="row tall">${ic("edit","i16")}<span class="lbl">Heading <i>– Build your Stillwater bundle</i></span></div></div>`);
  r.push(`<div class="row-wrap ind2"><div class="row tall">${ic("edit","i16")}<span class="lbl">Text <i>– For you, or for them. From bath soaks to body oils</i></span></div></div>`);
  if (S.section){
    r.push(`<button type="button" class="row tall ${S.sel==="section"?"sec-on":""}" data-act="select" data-id="section" aria-current="${S.sel==="section"}">${ic("chevD","i16")}${ic("gift","i16")}<span class="lbl">Build Your Bundle</span></button>`);
    r.push(`<div class="row-wrap ind2"><button type="button" class="row add tall" data-act="add-cat">${ic("plus","i16")}<span class="lbl">Add Category</span></button></div>`);
    S.cats.forEach((c,i)=>{
      r.push(`<div class="row-wrap ind2"><div class="row cat tall ${S.sel===c.id?"on":""}" draggable="true" data-drag="${c.id}">
        <button type="button" class="row" style="padding:0;min-height:0;background:none;color:inherit;font-style:inherit" data-act="select" data-id="${c.id}" aria-current="${S.sel===c.id}">
          ${c.img?`<img class="thumb" src="${IMG(c.img)}" alt="">`:`<span class="thumb"></span>`}<span class="lbl">Category – ${esc(c.name)||"Untitled"}</span></button>
        <span class="grip" title="Drag to reorder" aria-hidden="true">${ic("grip","i16")}</span></div></div>`);
    });
  }
  r.push(`<button type="button" class="row add ${S.addOpen||S.msheet==="add"?"on":""}" data-act="open-add" data-anchor="add" aria-expanded="${S.addOpen}"><span class="sp"></span>${ic("plus","i16")}<span class="lbl">Add section</span></button>`);
  if (withFooter) r.push(`<hr>`, footerRows());

/* ---------- render ---------- */
function previewScroller(){ return $("#pvs"); }
function fitPreview(){
  const sf=$("#sf"), w=$("#pvw"), pv=$("#pv");
  if (!sf || !w) return;
  if (mobileUI || S.preview==="mobile"){ sf.style.zoom=""; sf.style.setProperty("--k",1); return; }
  const k = Math.min(1, pv.clientWidth/1440);
  sf.style.zoom = k; sf.style.setProperty("--k",k);
}
function renderPreview(){
  const w=$("#pvw"); if(!w) return;
  w.innerHTML = storefront(mobileUI || S.preview==="mobile");
  fitPreview();
}
function placeAddPop(){
  const pop=$("#addpop"), row=$('[data-anchor="add"]'), ed=$("#ed");
  if(!pop||!row||!ed) return;
  const er=ed.getBoundingClientRect(), rr=row.getBoundingClientRect();
  const top = Math.max(64, Math.min(rr.top - er.top - 60, er.height - pop.offsetHeight - 12));
  pop.style.left = (312) + "px"; pop.style.top = top + "px";
}
function render(){
  mobileUI = isMobileUI();
  const keep = {side:$("#side")?.scrollTop, pv:$("#pvs")?.scrollTop, sheet:$(".sheet-b")?.scrollTop};
  const af = document.activeElement; const afId = af && af.id;
  $("#app").innerHTML = mobileUI ? mobile() : desktop();
  fitPreview();
  if (!freshView){
    if ($("#side") && keep.side!=null) $("#side").scrollTop = keep.side;
    if ($("#pvs") && keep.pv!=null) $("#pvs").scrollTop = keep.pv;
    if ($(".sheet-b") && keep.sheet!=null && S.msheet===lastSheet) $(".sheet-b").scrollTop = keep.sheet;
  }
  freshView=false;
  // a freshly opened Sections sheet scrolls to the selected block
  if (mobileUI && S.msheet==="tree" && lastSheet!=="tree"){ const r=$(".sheet .row.cat.on, .sheet .row.sec-on"); const b=$(".sheet-b"); if(r&&b) b.scrollTop = r.getBoundingClientRect().top - b.getBoundingClientRect().top - 96; }
  lastSheet = S.msheet;
  placeAddPop();
  if (afId && document.getElementById(afId)) document.getElementById(afId).focus();
  if ((S.addOpen || S.msheet==="add") && $("#add-q") && !mobileUI) { const q=$("#add-q"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
function scrollPreviewTo(id){
  const sc=previewScroller(), el=$("#pv-"+id) || $(`[data-pick="${id}"]`);
  if(!sc||!el) return;
  const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 56;
  sc.scrollTo({top:Math.max(0,top), behavior:"smooth"});
}
let toastT;
function toast(msg){
  const t=$("#toast"); if(!t) return;
  t.innerHTML = ic("check","i16") + esc(msg); t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- actions ---------- */
function select(id){
  S.sel=id; S.menu=false;
  if (mobileUI) S.msheet = id ? "settings" : null;
  render();
  if (id) scrollPreviewTo(id);
}
function addSection(v){
  if (v!=="byb"){ toast(v==="app"?"Use Build Your Bundle for mix-and-match bundles":"Not part of this prototype"); return; }
  record();
  S.section = newSection(); S.addOpen=false; S.sel="section"; changed();
  if (mobileUI) S.msheet="settings";
  render(); scrollPreviewTo("section");
}
function addCat(){
  record();
  const c=newCat(false); S.cats.push(c); S.sel=c.id; S.menu=false; changed();
  if (mobileUI) S.msheet="settings";
  render(); scrollPreviewTo(c.id);
}
function openPicker(){
  const c=S.cats.find(c=>c.id===S.sel); if(!c) return;
  S.picker=c.id; S.pickerChoice=c.coll || c.preset || "fragrance";
  if (mobileUI) S.msheet="picker";
  render();
  setTimeout(()=>{ const r=$('.copt input:checked'); if(r) r.focus(); },0);
}
function confirmPicker(){
  const c=S.cats.find(c=>c.id===S.picker); if(!c||!S.pickerChoice) return;
  record(); c.coll=S.pickerChoice; changed();
  S.picker=null; if (mobileUI) S.msheet="settings";
  render(); scrollPreviewTo(c.id);
}
function closePicker(){ S.picker=null; if(mobileUI) S.msheet="settings"; render(); }
function save(){
  if(!S.dirty) return;
  S.dirty=false; S.live=true; S.menu=false; S.addOpen=false; S.pageOpen=false;
  if (mobileUI) { S.msheet="live"; }
  else S.sel=null;
  render(); toast("Saved");
}

document.addEventListener("click", e=>{
  if (!$("#app").contains(e.target)) return;
  const b = e.target.closest("[data-act]");
  // click outside popovers closes them
  if (S.pageOpen && !e.target.closest("#pagepop") && !(b && b.dataset.act==="toggle-page")) { S.pageOpen=false; if(!b){ render(); return; } }
  if (S.addOpen && !e.target.closest("#addpop") && !(b && b.dataset.act==="open-add")) { S.addOpen=false; if(!b){ render(); return; } }
  if (S.menu && !(b && (b.dataset.act==="menu"||b.closest(".menu")))) { S.menu=false; if(!b){ render(); return; } }
  if (!b){
    const pick = e.target.closest("[data-pick]");
    if (pick) select(pick.dataset.pick);
    return;
  }
  const a=b.dataset.act;
  switch(a){
    case "toggle-page": S.pageOpen=!S.pageOpen; render(); break;
    case "pick-page": S.pageOpen=false; if(mobileUI) S.msheet=null; render(); if(b.dataset.v!=="build-your-bundle") toast("This prototype stays on build-your-bundle"); break;
    case "m-templates": S.msheet="templates"; render(); break;
    case "open-add": S.addOpen=!S.addOpen; S.addQ="bundle"; S.addTab="sections"; if(mobileUI){ S.addOpen=false; S.msheet="add"; } render(); break;
    case "m-add": S.msheet="add"; S.addQ="bundle"; render(); break;
    case "m-tree": S.msheet="tree"; render(); break;
    case "add-tab": S.addTab=b.dataset.v; render(); break;
    case "clear-q": S.addQ=""; render(); $("#add-q")?.focus(); break;
    case "add-section": addSection(b.dataset.v); break;
    case "select": select(b.dataset.id); break;
    case "deselect": S.sel=null; S.menu=false; if(mobileUI) S.msheet= S.section ? "tree" : null; render(); break;
    case "add-cat": addCat(); break;
    case "open-picker": openPicker(); break;
    case "close-picker": closePicker(); break;
    case "close-picker-scrim": if(e.target===b) closePicker(); break;
    case "confirm-picker": confirmPicker(); break;
    case "img-change": { const c=S.cats.find(c=>c.id===S.sel); record(); const i=BANNERS.indexOf(c.img); c.img=BANNERS[(i+1)%BANNERS.length]; changed(); render(); break; }
    case "img-remove": { const c=S.cats.find(c=>c.id===S.sel); record(); c.img=null; changed(); render(); break; }
    case "remove-cat": record(); S.cats=S.cats.filter(c=>c.id!==S.sel); S.sel="section"; S.menu=false; changed(); if(mobileUI) S.msheet="tree"; render(); toast("Block removed"); break;
    case "remove-section": record(); S.section=null; S.cats=[]; S.sel=null; S.menu=false; S.bag=[]; changed(); if(mobileUI) S.msheet=null; render(); toast("Section removed"); break;
    case "menu": S.menu=!S.menu; render(); break;
    case "move": { const i=S.cats.findIndex(c=>c.id===S.sel), j=i+(+b.dataset.d); if(j<0||j>=S.cats.length) break; record(); const [c]=S.cats.splice(i,1); S.cats.splice(j,0,c); S.menu=false; changed(); render(); scrollPreviewTo(c.id); break; }
    case "pv": S.preview=b.dataset.v; render(); break;
    case "undo": undo(); break;
    case "redo": redo(); break;
    case "save": save(); break;
    case "close-sheet": S.msheet=null; if(S.picker) S.picker=null; render(); break;
    case "view-page": toast("Opens stillwater.ca/pages/build-your-bundle"); break;
    case "add-menu": toast("Next: Online Store › Navigation › Main menu"); break;
    case "sf-tier": S.tier=+b.dataset.i; S.bag=S.bag.slice(0,[S.section.size1,S.section.size2][S.tier]); renderPreview(); break;
    case "sf-rm": S.bag=S.bag.filter(x=>x!==b.dataset.id); renderPreview(); break;
    case "sf-pick": { const c=S.cats.find(c=>c.coll); if(c) scrollPreviewTo(c.id); else toast("Add a Category block with a collection first"); break; }
    case "sf-add": { const id=b.dataset.id, n=[S.section.size1,S.section.size2][S.tier]; const i=S.bag.indexOf(id); if(i>=0) S.bag.splice(i,1); else if(S.bag.length<n) S.bag.push(id); else toast("Your bundle is full"); renderPreview(); break; }
    case "noop": case "sf-noop": break;
  }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if (t.id==="add-q"){ S.addQ=t.value; const r=$("#add-res"); if(r) r.innerHTML=addResults(mobileUI); placeAddPop(); return; }
  if (t.name==="coll"){ S.pickerChoice=t.value; $$(".copt").forEach(l=>l.classList.toggle("on", l.querySelector("input").checked)); const s=$('[data-act="confirm-picker"]'); if(s) s.disabled=false; return; }
  if (t.dataset.f && S.section){
    recordTyping();
    const f=t.dataset.f;
    S.section[f] = t.type==="checkbox" ? t.checked : (f.startsWith("size") ? +t.value : t.value);
    if (f.startsWith("size")) S.bag=S.bag.slice(0, [S.section.size1,S.section.size2][S.tier]);
    changed(); renderPreview(); syncSave(); return;
  }
  if (t.dataset.c){
    const c=S.cats.find(c=>c.id===S.sel); if(!c) return;
    recordTyping(); c[t.dataset.c]=t.value; changed(); renderPreview(); syncSave();
    const lbl=$(`[data-id="${c.id}"] .lbl`); if(lbl) lbl.textContent="Category – "+(c.name||"Untitled");
  }
});
document.addEventListener("change", e=>{ if(e.target.type==="checkbox"||e.target.tagName==="SELECT") e.target.dispatchEvent(new Event("input",{bubbles:true})); });
function syncSave(){ $$('[data-act="save"]').forEach(b=>b.disabled=!S.dirty); $$('[data-act="undo"]').forEach(b=>b.disabled=!hist.length); if(S.live===false) $(".live")?.remove(); }
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){
    if (S.picker){ closePicker(); return; }
    if (S.pageOpen||S.addOpen||S.menu){ S.pageOpen=S.addOpen=S.menu=false; render(); return; }
    if (mobileUI && S.msheet){ S.msheet=null; render(); }
  }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); e.shiftKey?redo():undo(); }
  if (e.key==="Enter" && e.target.id==="add-q"){ const f=$("#add-res [data-act='add-section']"); if(f) f.click(); }
});

/* drag to reorder Category blocks in the template tree */
let dragId=null;
document.addEventListener("dragstart", e=>{ const r=e.target.closest?.("[data-drag]"); if(!r) return; dragId=r.dataset.drag; r.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch(_){} });
document.addEventListener("dragover", e=>{ const r=e.target.closest?.("[data-drag]"); if(!dragId||!r) return; e.preventDefault(); const after = e.clientY > r.getBoundingClientRect().top + r.offsetHeight/2; $$("[data-drag]").forEach(x=>x.classList.remove("drop-before","drop-after")); r.classList.add(after?"drop-after":"drop-before"); });
document.addEventListener("drop", e=>{ const r=e.target.closest?.("[data-drag]"); if(!dragId||!r) return; e.preventDefault();
  const after = r.classList.contains("drop-after"); const from=S.cats.findIndex(c=>c.id===dragId); record(); const [c]=S.cats.splice(from,1);
  let to=S.cats.findIndex(x=>x.id===r.dataset.drag); if(to<0) to=from; if(after) to++; S.cats.splice(to,0,c); changed(); dragId=null; render(); scrollPreviewTo(c.id); });
document.addEventListener("dragend", ()=>{ dragId=null; $$("[data-drag]").forEach(x=>x.classList.remove("dragging","drop-before","drop-after")); });

/* ---------- controls ---------- */
function fitPhone(){
  const st=$("#stage"); const s=Math.min(1,(st.clientHeight-32)/878,(st.clientWidth-32)/419);
  document.body.style.setProperty("--s", Math.max(.4,s).toFixed(3));
}
let lastMode=null;
new ResizeObserver(()=>{ const m=isMobileUI(); if(m!==lastMode){ lastMode=m; if(S){ if(m && S.sel && !S.msheet) S.msheet="settings"; render(); } } else fitPreview(); placeAddPop(); }).observe($("#screen"));
window.addEventListener("resize", fitPhone);
function setDevice(m){
  document.body.classList.toggle("phone", m==="mobile");
  fitPhone();
  $("#dev-desktop").setAttribute("aria-pressed",String(m!=="mobile"));
  $("#dev-mobile").setAttribute("aria-pressed",String(m==="mobile"));
  try{ localStorage.setItem("sw2-device",m); }catch(e){}
}
$("#dev-desktop").addEventListener("click",()=>setDevice("desktop"));
$("#dev-mobile").addEventListener("click",()=>setDevice("mobile"));
$("#jump").addEventListener("change",e=>{ const v=+e.target.value; if(v){ preset(v); } e.target.value=""; });
$("#restart").addEventListener("click",()=>preset(1));
const FORCE=document.documentElement.dataset.force;
let dev="desktop"; try{ dev=localStorage.getItem("sw2-device")||"desktop"; }catch(e){}
if (FORCE==="iphone") dev="mobile";
if (window.innerWidth<520) dev="desktop"; // on a real phone, the editor fills the screen instead of a phone inside a phone
setDevice(dev);
preset(1);
document.fonts && document.fonts.ready.then(fitPreview);
window.addEventListener("load", fitPreview);
})();
</script>
</body>
</html>
